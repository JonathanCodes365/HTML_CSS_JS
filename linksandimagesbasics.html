<!DOCTYPE html>
<html>
<head>
    <title>HTML Basics - Links and Images</title>
</head>

<body>

    <h1>Hi, This is HTML Basics</h1>

    <h2>1. HTML Links</h2>

    <p>Here is a link to Google:</p>

    <a href="https://www.google.com">Visit Google</a>

    <br><br>

    <p>Here is a link to GitHub:</p>

    <a href="https://github.com">Visit GitHub</a>


    <h2>2. Open Link in a New Tab</h2>

    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>


    <h2>3. Adding an Image</h2>

    <img src="https://picsum.photos/300/200" alt="Random Image">


    <h2>4. Image with a Link</h2>

    <a href="https://github.com">
        <img src="https://picsum.photos/200/150" alt="Click to visit GitHub">
    </a>

</body>
</html>
